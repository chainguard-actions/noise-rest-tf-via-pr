name: Test missing tool fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          tool: nonexistent-tf-tool
          command: plan
          pr-number: "0"
          upload-plan: "false"
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SUMMARY: ${{ steps.action.outputs.summary }}
        run: |
          echo "outcome: $OUTCOME"; echo "summary: $SUMMARY"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when tool is missing"
            exit 1
          fi
          if [ -n "$SUMMARY" ]; then
            echo "FAIL: post step should not have run"
            exit 1
          fi
          echo "PASS"
