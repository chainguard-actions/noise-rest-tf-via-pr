name: Test tofu plan with variables
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake tofu CLI
        run: |
          mkdir -p "$RUNNER_TEMP/fakebin" tf-work
          cp tests/fixtures/fake-tf.sh "$RUNNER_TEMP/fakebin/tofu"
          chmod +x "$RUNNER_TEMP/fakebin/tofu"
          for t in gh unzip; do
            if ! command -v "$t" >/dev/null; then
              printf '#!/bin/sh\nexit 0\n' > "$RUNNER_TEMP/fakebin/$t"
              chmod +x "$RUNNER_TEMP/fakebin/$t"
            fi
          done
          echo "$RUNNER_TEMP/fakebin" >> "$GITHUB_PATH"
          echo "FAKE_TF_LOG=$RUNNER_TEMP/fake-tf.log" >> "$GITHUB_ENV"
      - id: action
        uses: .
        with:
          tool: tofu
          command: plan
          arg-chdir: tf-work
          arg-var: "a=1,b=2"
          pr-number: "0"
          upload-plan: "false"
      - name: Assert outputs
        env:
          IDENTIFIER: ${{ steps.action.outputs.identifier }}
          EXITCODE: ${{ steps.action.outputs.exitcode }}
          COMMAND: ${{ steps.action.outputs.command }}
        run: |
          echo "identifier: $IDENTIFIER"
          echo "exitcode: $EXITCODE"
          echo "command: $COMMAND"
          echo "fake log:"; cat "$FAKE_TF_LOG"
          hash=$(printf ' -chdir=tf-work -var=a=1 -var=b=2' | md5sum | cut -d' ' -f1)
          if [ "$IDENTIFIER" != "tofu-0-${hash}.tfplan" ]; then echo "FAIL: expected tofu-0-${hash}.tfplan"; exit 1; fi
          if [ "$EXITCODE" != "2" ]; then echo "FAIL: expected exitcode 2"; exit 1; fi
          if [ "$COMMAND" != "tofu plan -chdir=tf-work" ]; then echo "FAIL: command"; exit 1; fi
          grep -q "^tofu -chdir=tf-work init -var=a=1 -var=b=2" "$FAKE_TF_LOG" || { echo "FAIL: tofu init should receive vars"; exit 1; }
          grep -q "^tofu -chdir=tf-work plan -var=a=1 -var=b=2 -detailed-exitcode -out=tfplan" "$FAKE_TF_LOG" || { echo "FAIL: plan args"; exit 1; }
          echo "PASS"
